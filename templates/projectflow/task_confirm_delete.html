{% extends 'base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3>Delete Task</h3>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete the task "{{ object.name }}"?</p>
                    <p class="text-danger">This action cannot be undone and will delete all subtasks associated with this task.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <button type="submit" class="btn btn-danger">Delete</button>
                            <a href="{% url 'projectflow:task-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
