{% extends 'base.html' %}
{% load static %}

{% block title %}Login - Workflow{% endblock %}

{% block content %}
<div class="layout-login-centered-boxed">
    <div class="layout-login-centered-boxed__form">
        <div class="d-flex flex-column justify-content-center align-items-center mt-2 mb-4">
            <img src="{% static 'images/stack-logo-blue.svg' %}" width="48" alt="Workflow">
            <h5 class="m-0">Welcome to Workflow</h5>
            <p class="mb-0 text-muted">Login to access your account</p>
        </div>

        <div class="card card-body">
            <form method="post" novalidate>
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="text-label" for="id_username">Username:</label>
                    <div class="input-group input-group-merge">
                        <input id="id_username" type="text" name="username" class="form-control form-control-prepended" placeholder="Enter your username">
                        <div class="input-group-prepend">
                            <div class="input-group-text">
                                <span class="far fa-user"></span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="text-label" for="id_password">Password:</label>
                    <div class="input-group input-group-merge">
                        <input id="id_password" type="password" name="password" class="form-control form-control-prepended" placeholder="Enter your password">
                        <div class="input-group-prepend">
                            <div class="input-group-text">
                                <span class="fa fa-key"></span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <button class="btn btn-block btn-primary" type="submit">Login</button>
                </div>
                
                <div class="text-center">
                    <a href="#" class="text-black-70">Forgot Password?</a>
                </div>
            </form>
        </div>
        
        <div class="card-footer text-center text-black-50">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Remove sidebar and header for login page
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.mdk-drawer-layout').classList.remove('js-mdk-drawer-layout');
        document.querySelector('.mdk-drawer').remove();
        document.querySelector('.navbar').remove();
    });
</script>
{% endblock %}
