{% load static %}
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Password Reset Complete - Workflow</title>

    <!-- Prevent the demo from appearing in search engines -->
    <meta name="robots" content="noindex">

    <!-- Perfect Scrollbar -->
    <link type="text/css" href="{% static 'vendor/perfect-scrollbar.css' %}" rel="stylesheet">

    <!-- App CSS -->
    <link type="text/css" href="{% static 'css/app.css' %}" rel="stylesheet">
    <link type="text/css" href="{% static 'css/app.rtl.css' %}" rel="stylesheet">

    <!-- Material Design Icons -->
    <link type="text/css" href="{% static 'css/vendor-material-icons.css' %}" rel="stylesheet">
    <link type="text/css" href="{% static 'css/vendor-material-icons.rtl.css' %}" rel="stylesheet">

    <!-- Font Awesome FREE Icons -->
    <link type="text/css" href="{% static 'css/vendor-fontawesome-free.css' %}" rel="stylesheet">
    <link type="text/css" href="{% static 'css/vendor-fontawesome-free.rtl.css' %}" rel="stylesheet">

    <style>
        /* Fix for missing font files */
        @font-face {
            font-family: 'Material Icons';
            font-style: normal;
            font-weight: 400;
            src: url({% static 'fonts/material-icons/MaterialIcons-Regular.woff2' %}) format('woff2'),
                 url({% static 'fonts/material-icons/MaterialIcons-Regular.woff' %}) format('woff'),
                 url({% static 'fonts/material-icons/MaterialIcons-Regular.ttf' %}) format('truetype');
        }

        @font-face {
            font-family: 'Font Awesome 5 Free';
            font-style: normal;
            font-weight: 900;
            font-display: auto;
            src: url({% static 'fonts/fontawesome-free/fa-solid-900.woff2' %}) format('woff2'),
                 url({% static 'fonts/fontawesome-free/fa-solid-900.woff' %}) format('woff'),
                 url({% static 'fonts/fontawesome-free/fa-solid-900.ttf' %}) format('truetype');
        }
    </style>
</head>

<body class="layout-login-centered-boxed">
    <div class="layout-login-centered-boxed__form card">
        <div class="d-flex flex-column justify-content-center align-items-center mt-2 mb-5 navbar-light">
            <a href="/" class="navbar-brand flex-column mb-2 align-items-center mr-0" style="min-width: 0">
                <img class="navbar-brand-icon mr-0 mb-2" src="{% static 'images/stack-logo-blue.svg' %}" width="25" alt="Workflow">
                <span>Workflow</span>
            </a>
            <p class="m-0">Password Reset Complete</p>
        </div>

        <div class="alert alert-soft-success d-flex" role="alert">
            <i class="material-icons mr-3">check_circle</i>
            <div class="text-body">Your password has been set. You may go ahead and log in now.</div>
        </div>

        <div class="card-body text-center">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary">Login</a>
        </div>
    </div>

    <!-- jQuery -->
    <script src="{% static 'vendor/jquery.min.js' %}"></script>

    <!-- Bootstrap -->
    <script src="{% static 'vendor/popper.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap.min.js' %}"></script>

    <!-- Perfect Scrollbar -->
    <script src="{% static 'vendor/perfect-scrollbar.min.js' %}"></script>

    <!-- DOM Factory -->
    <script src="{% static 'vendor/dom-factory.js' %}"></script>

    <!-- MDK -->
    <script src="{% static 'vendor/material-design-kit.js' %}"></script>

    <!-- App -->
    <script src="{% static 'js/app.js' %}"></script>
</body>

</html>
